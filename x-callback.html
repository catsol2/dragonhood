<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dragon Hood — X Authorization</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #050505;
      color: #00ff66;
      font-family: 'Courier New', Courier, monospace;
    }
    .box {
      width: min(700px, 90%);
      padding: 30px;
      border: 1px solid rgba(0,255,102,0.4);
      background: #071009;
      box-shadow: 0 0 30px rgba(0,255,102,0.12);
    }
    h1 {
      color: #fff;
      font-size: 20px;
      margin-top: 0;
    }
    #status {
      white-space: pre-wrap;
      line-height: 1.6;
      font-size: 13px;
    }
    .error { color: #ff5c5c; }
    .success { color: #00ff66; }
  </style>
</head>
<body>
  <div class="box">
    <h1># DRAGONHOOD — X AUTHORIZATION</h1>
    <div id="status">Processing X authorization...</div>
  </div>

<script>
const statusBox = document.getElementById("status");

function showStatus(message, type = "") {
  statusBox.className = type;
  statusBox.textContent = message;
}

async function main() {
  try {
    const params = new URLSearchParams(window.location.search);
    const code = params.get("code");
    const oauthError = params.get("error");
    const oauthErrorDescription = params.get("error_description");

    if (oauthError) {
      throw new Error(oauthErrorDescription || oauthError);
    }

    if (!code) {
      throw new Error("No authorization code returned by X.");
    }

    const codeVerifier = sessionStorage.getItem("x_code_verifier") || "";
    const redirectUri = "https://dragonhood.xyz/x-callback.html";

    showStatus("Connecting with Twitter server...");

    const tokenResponse = await fetch("/api/x-token", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        code: code,
        code_verifier: codeVerifier,
        redirect_uri: redirectUri
      })
    });

    const tokenData = await tokenResponse.json();

    if (!tokenResponse.ok || !tokenData.access_token) {
      throw new Error("Failed to get access token from X: " + JSON.stringify(tokenData));
    }

    sessionStorage.setItem("x_access_token", tokenData.access_token);
    showStatus("Retrieving your X username...");

    const meResponse = await fetch("/api/x-me", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ access_token: tokenData.access_token })
    });

    const meData = await meResponse.json();

    if (meResponse.ok && meData.data && meData.data.username) {
      const handle = "@" + meData.data.username;
      sessionStorage.setItem("x_user_handle", handle);
      sessionStorage.setItem("x_user_id", meData.data.id || "");
      showStatus("Connected as " + handle + "!\nRedirecting to tasks...", "success");
    } else {
      throw new Error("Could not read username from X: " + JSON.stringify(meData));
    }

    sessionStorage.setItem("x_authenticated", "true");

    setTimeout(() => {
      window.location.replace("/index.html?screen=tasks");
    }, 600);

  } catch (error) {
    console.error(error);
    showStatus("X Authorization Error:\n" + (error.message || String(error)), "error");
  }
}

main();
</script>
</body>
</html>
